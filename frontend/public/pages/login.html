<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Infra Web</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Plateforme d'Infrastructures Virtuelles</h1>
        <nav>
            <a href="../index.html">Accueil</a>
            <a href="register.html">Inscription</a>
        </nav>
    </header>

    <main>
        <section class="auth-card">
            <h2>Connexion</h2>
            <p id="auth-message" class="form-message" hidden></p>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Se connecter</button>
            </form>
            <p class="auth-switch">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const messageEl = document.getElementById('auth-message');
            messageEl.hidden = true;

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            try {
                await loginUser(user, pass);
            } catch (error) {
                messageEl.textContent = error.message;
                messageEl.className = 'form-message error';
                messageEl.hidden = false;
            }
        }
    </script>
</body>
</html>
