<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Infra Web</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Plateforme d'Infrastructures Virtuelles</h1>
        <nav>
            <a href="../index.html">Accueil</a>
            <span id="user-badge" class="user-badge"></span>
            <button onclick="logout()" class="btn-danger">Déconnexion</button>
        </nav>
    </header>

    <main>
        <h2>Tableau de bord</h2>
        <p id="welcome-text">Chargement de votre espace de travail...</p>

        <div id="infra-workspace" class="workspace-placeholder">
            <p><em>Interface visuelle « plug &amp; play » à venir (Étapes 1 à 4)...</em></p>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth();
            if (!user) return;

            document.getElementById('user-badge').textContent = `${user.username} (${user.email})`;
            document.getElementById('welcome-text').textContent =
                `Bienvenue ${user.username} ! Vous pourrez ici créer, sauvegarder et partager vos infrastructures virtuelles.`;
        });
    </script>
</body>
</html>
