<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Infra Web</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Plateforme d'Infrastructures Virtuelles</h1>
        <nav>
            <a href="../index.html">Accueil</a>
            <a href="login.html">Connexion</a>
        </nav>
    </header>

    <main>
        <section class="auth-card">
            <h2>Créer un compte</h2>
            <p id="register-message" class="form-message" hidden></p>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" required minlength="3" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="password-confirm">Confirmer le mot de passe</label>
                    <input type="password" id="password-confirm" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">S'inscrire</button>
            </form>
            <p class="auth-switch">Déjà un compte ? <a href="login.html">Se connecter</a></p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        async function handleRegister(event) {
            event.preventDefault();
            const messageEl = document.getElementById('register-message');
            messageEl.hidden = true;

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('password-confirm').value;

            if (password !== confirm) {
                messageEl.textContent = 'Les mots de passe ne correspondent pas.';
                messageEl.className = 'form-message error';
                messageEl.hidden = false;
                return;
            }

            try {
                await registerUser(username, email, password);
                messageEl.textContent = 'Compte créé ! Redirection vers la connexion...';
                messageEl.className = 'form-message success';
                messageEl.hidden = false;
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                messageEl.textContent = error.message;
                messageEl.className = 'form-message error';
                messageEl.hidden = false;
            }
        }
    </script>
</body>
</html>
